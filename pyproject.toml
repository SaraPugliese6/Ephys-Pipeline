[project]
name = "dandi-ephys-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sara Pugliese", email = "sarapugliese.edu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dandi>=0.77.0",
    "h5py>=3.16.0",
    "jupyterlab>=4.6.3",
    "kilosort>=4.1.7",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=2.3.3",
    "probeinterface>=0.3.2",
    "pynapple>=0.11.4",
    "remfile>=0.1.14",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "spikeinterface-gui>=0.13.1",
    "spikeinterface[full,widgets]>=0.104.8",
    "viewephys>=1.3.0",
]

[project.scripts]
dandi-ephys-pipeline = "dandi_ephys_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
